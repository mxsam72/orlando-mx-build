name: Build v021 mirrored vehicle and bike graphics fix
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v021]
    paths:
      - 'V021_SOURCE/**'
      - 'TOOLS/*v021*.py'
      - '.github/workflows/build-v021.yml'
permissions:
  contents: read
concurrency:
  group: orlando-v021-graphics-handedness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source dependencies
        run: python -m pip install -r requirements-v009.txt
      - name: Generate and validate v021 source checkpoint
        run: python TOOLS/build_v021.py --source-only
      - name: Save source checkpoint before native compile
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v021-source-checkpoint
          retention-days: 90
          path: |
            V021_OUTPUT/terrain.raw
            V021_OUTPUT/start.tcl
            V021_OUTPUT/orlandomx_2026_v021.rdf
            V021_OUTPUT/jump_profiles.json
            V021_OUTPUT/start_layout_resolved.json
            V021_OUTPUT/facility_layout.json
            V021_OUTPUT/facility_meshes.json
            V021_OUTPUT/vehicle_meshes.json
            V021_OUTPUT/sign_graphic_meshes.json
            V021_OUTPUT/vehicle_catalog.json
            DOCUMENTATION/v021*.json
            DOCUMENTATION/v021_qa/
      - name: Compile fresh native MAP TRH and PKZ
        run: python TOOLS/build_windows_v021.py
      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v021-game-candidate
          retention-days: 90
          path: |
            12_RELEASE/OrlandoMX_2026_v021.pkz
            12_RELEASE/OrlandoMX_2026_v021.pkz.sha256
            12_RELEASE/OrlandoMX_v021_Validation.json
            12_RELEASE/Install_v021.txt
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v021-build-evidence
          retention-days: 90
          path: |
            DOCUMENTATION/v021*.json
            DOCUMENTATION/v021*.txt
            DOCUMENTATION/v021*.md
            DOCUMENTATION/v021_qa/
            DOCUMENTATION/*.log
            DOCUMENTATION/native*validation.json
            DOCUMENTATION/native_build_failure.txt
            DOCUMENTATION/track_code.txt
      - name: Preserve native texture payloads if validation fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v021-native-failure-data
          retention-days: 30
          path: |
            BUILD/v009_work/08_OBJECTS_GAME/scenery.edf
            12_RELEASE/orlandomx_2026_v021/orlandomx_2026_v021.map
            V021_OUTPUT/facility_textures/
