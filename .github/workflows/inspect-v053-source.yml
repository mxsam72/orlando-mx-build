name: Inspect accepted soil for v053 source authoring
on:
  push:
    branches: [inspect-v053-source]
    paths: ['TOOLS/inspect_v053_source.py', '.github/workflows/inspect-v053-source.yml']
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      V052_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - run: python TOOLS/inspect_v053_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: v053-soil-authoring-inputs
          path: BUILD/v053_authoring_inputs/*
