name: Build v032 Pup Whatley memorial on v030
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v032]
    paths: ['V032_SOURCE/**', 'TOOLS/build_v032.py', 'TOOLS/build_windows_v032.py', 'TOOLS/v032_*.py', 'TOOLS/render_v032_previews.py', '.github/workflows/build-v032.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v032-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
      V032_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - name: Restore immutable tested v030 source
        run: python TOOLS/v032_release_transfer.py source
      - name: Add approved memorial and validate readable signs and v030 preservation
        run: python TOOLS/build_v032.py --source-only
      - name: Compile and verify native MAP TRH textures and PKZ
        run: python TOOLS/build_windows_v032.py
      - name: Preserve verified delivery and complete source privately
        run: python TOOLS/v032_release_transfer.py deliver

