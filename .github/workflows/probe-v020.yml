name: Diagnose v020 native textures
on:
  push:
    branches: [rebuild-v020]
    paths: ['TOOLS/probe_textures_v020.py', '.github/workflows/probe-v020.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - run: python TOOLS/probe_textures_v020.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: OrlandoMX-v020-texture-diagnosis
          path: DOCUMENTATION/v020_texture_probe/
