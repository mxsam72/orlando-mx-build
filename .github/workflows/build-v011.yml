name: Build v011 IRL corrections
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v011-jumps-facilities]
    paths:
      - 'V011_SOURCE/**'
      - 'TOOLS/*v011*.py'
      - '.github/workflows/build-v011.yml'
      - 'BUILD_V011_LOCAL.bat'
permissions:
  contents: read
concurrency:
  group: orlando-v011-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source dependencies
        run: python -m pip install -r requirements-v009.txt
      - name: Generate and validate v011 source checkpoint
        run: python TOOLS/build_v011.py --source-only
      - name: Save source checkpoint before native compile
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v011-source-checkpoint
          retention-days: 90
          path: |
            V011_OUTPUT/terrain.raw
            V011_OUTPUT/start.tcl
            V011_OUTPUT/orlandomx_2026_v011.rdf
            V011_OUTPUT/facility_layout.json
            V011_OUTPUT/facility_meshes.json
            DOCUMENTATION/v011*.json
            DOCUMENTATION/v011_qa/
      - name: Compile fresh native MAP TRH and PKZ
        run: python TOOLS/build_windows_v011.py
      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v011-game-candidate
          retention-days: 90
          path: |
            12_RELEASE/OrlandoMX_2026_v011.pkz
            12_RELEASE/OrlandoMX_2026_v011.pkz.sha256
            12_RELEASE/OrlandoMX_v011_Validation.json
            12_RELEASE/Install_v011.txt
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v011-build-evidence
          retention-days: 90
          path: |
            DOCUMENTATION/v011*.json
            DOCUMENTATION/v011*.txt
            DOCUMENTATION/v011*.md
            DOCUMENTATION/v011_qa/
            DOCUMENTATION/*.log
            DOCUMENTATION/native*validation.json
            DOCUMENTATION/native_build_failure.txt
            DOCUMENTATION/track_code.txt
