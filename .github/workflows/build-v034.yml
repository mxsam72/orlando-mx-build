name: Build v034 wider holeshot approach
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v034]
    paths: ['V034_SOURCE/**', 'TOOLS/build_v034.py', 'TOOLS/build_windows_v034.py', 'TOOLS/v034_*.py', 'TOOLS/render_v034_holeshot.py', 'TOOLS/verify_v034_source.py', '.github/workflows/build-v034.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v034-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
      V034_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - name: Restore tested v033 source
        run: python TOOLS/v034_release_transfer.py source
      - name: Build local holeshot geometry and race references
        run: python TOOLS/build_v034.py --source-only
      - name: Independently verify jumps gate anchors dirt masks and clearance
        run: python TOOLS/verify_v034_source.py
      - name: Compile and verify native MAP TRH textures and PKZ
        run: python TOOLS/build_windows_v034.py
      - name: Preserve verified delivery and complete source privately
        run: python TOOLS/v034_release_transfer.py deliver



