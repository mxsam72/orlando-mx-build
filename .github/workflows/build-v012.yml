name: Build v012 final obstacles and layout
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v012-final-obstacles-layout]
    paths:
      - 'V012_SOURCE/**'
      - 'TOOLS/*v012*.py'
      - '.github/workflows/build-v012.yml'
      - 'BUILD_V012_LOCAL.bat'
permissions:
  contents: read
concurrency:
  group: orlando-v012-final-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source dependencies
        run: python -m pip install -r requirements-v009.txt
      - name: Generate and validate v012 source checkpoint
        run: python TOOLS/build_v012.py --source-only
      - name: Save source checkpoint before native compile
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v012-source-checkpoint
          retention-days: 90
          path: |
            V012_OUTPUT/terrain.raw
            V012_OUTPUT/start.tcl
            V012_OUTPUT/orlandomx_2026_v012.rdf
            V012_OUTPUT/jump_profiles.json
            V012_OUTPUT/start_layout_resolved.json
            V012_OUTPUT/facility_layout.json
            V012_OUTPUT/facility_meshes.json
            DOCUMENTATION/v012*.json
            DOCUMENTATION/v012_qa/
      - name: Compile fresh native MAP TRH and PKZ
        run: python TOOLS/build_windows_v012.py
      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v012-game-candidate
          retention-days: 90
          path: |
            12_RELEASE/OrlandoMX_2026_v012.pkz
            12_RELEASE/OrlandoMX_2026_v012.pkz.sha256
            12_RELEASE/OrlandoMX_v012_Validation.json
            12_RELEASE/Install_v012.txt
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v012-build-evidence
          retention-days: 90
          path: |
            DOCUMENTATION/v012*.json
            DOCUMENTATION/v012*.txt
            DOCUMENTATION/v012*.md
            DOCUMENTATION/v012_qa/
            DOCUMENTATION/*.log
            DOCUMENTATION/native*validation.json
            DOCUMENTATION/native_build_failure.txt
            DOCUMENTATION/track_code.txt
