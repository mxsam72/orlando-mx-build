name: Final v064 build - approved B corners and C loam
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v064]
    paths: ['.github/workflows/build-v064.yml', 'TOOLS/*v064*.py', 'V064_SOURCE/**']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v064-native
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      V052_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source-authoring dependencies
        run: python -m pip install -r requirements-v009.txt shapely==2.2.0
      - name: Recover tested source and author the exact approved hybrid and roller
        run: |
          New-Item -ItemType Directory -Force DOCUMENTATION | Out-Null
          python TOOLS/v064_inputs.py restore 2>&1 | Tee-Object DOCUMENTATION/v064_source_recovery.log
          exit $LASTEXITCODE
      - name: Verify native bitmap and scenery coordinate checker contracts
        run: |
          python TOOLS/test_native_texture_aliases_v044.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TOOLS/test_native_coordinate_scan_v044.py
          exit $LASTEXITCODE
      - name: Check complete native staging and retained scenery
        run: python TOOLS/build_windows_v064.py stage
      - name: Preserve the approved checked source before compilation
        run: python TOOLS/v064_transfer.py checkpoint
      - name: Compile collision including the wall roller and merge race routes
        run: python TOOLS/build_windows_v064.py collision
      - name: FINAL NATIVE VISUAL TERRAIN COMPILATION AND VALIDATION
        run: python TOOLS/build_windows_v064.py final
      - name: Publish validated PKZ with download link
        run: python TOOLS/v064_transfer.py deliver
      - name: Preserve diagnostics on failure
        if: failure()
        run: python TOOLS/v064_transfer.py diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v064-validation-and-delivery
          path: |
            V064_OUTPUT/*validation.json
            V064_OUTPUT/native_compile_results.json
            V064_OUTPUT/generated_final_inputs.json
            V061_OUTPUT/validation.json
            BUILD/v064_recovered_inputs.json
            DOCUMENTATION/*v064*.log
            DOCUMENTATION/*v064*.json
            12_RELEASE/OrlandoMX_v064_Validation.json
            12_RELEASE/Install_v064.txt
            BUILD/v064_delivery.json
            BUILD/v064_checkpoint_descriptor.json
