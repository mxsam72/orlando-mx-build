name: Final v065 build - C start dirt and cleared left strip
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v065]
    paths: ['.github/workflows/build-v065.yml', 'TOOLS/*v065*.py', 'V065_SOURCE/**']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v065-native
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      V052_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned authoring dependencies
        run: python -m pip install -r requirements-v009.txt shapely==2.2.0
      - name: Recover complete v064 and correct start C coverage and grass mask
        run: |
          New-Item -ItemType Directory -Force DOCUMENTATION | Out-Null
          python TOOLS/v065_inputs.py restore 2>&1 | Tee-Object DOCUMENTATION/v065_source_recovery.log
          exit $LASTEXITCODE
      - name: Verify native bitmap and coordinate checker contracts
        run: |
          python TOOLS/test_native_texture_aliases_v044.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TOOLS/test_native_coordinate_scan_v044.py
          exit $LASTEXITCODE
      - name: Stage complete checked materials and retained scenery
        run: python TOOLS/build_windows_v065.py stage
      - name: Preserve complete corrected source before compilation
        run: python TOOLS/v065_transfer.py checkpoint
      - name: Compile unchanged collision and merge race routes
        run: python TOOLS/build_windows_v065.py collision
      - name: FINAL NATIVE VISUAL TERRAIN COMPILATION AND VALIDATION
        run: python TOOLS/build_windows_v065.py final
      - name: Publish validated PKZ with download link
        run: python TOOLS/v065_transfer.py deliver
      - name: Preserve diagnostics on failure
        if: failure()
        run: python TOOLS/v065_transfer.py diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v065-validation-and-delivery
          path: |
            V065_OUTPUT/*validation.json
            V065_OUTPUT/native_compile_results.json
            V065_OUTPUT/generated_final_inputs.json
            BUILD/v065_recovered_inputs.json
            DOCUMENTATION/*v065*.log
            DOCUMENTATION/*v065*.json
            12_RELEASE/OrlandoMX_v065_Validation.json
            12_RELEASE/Install_v065.txt
            BUILD/v065_delivery.json
            BUILD/v065_checkpoint_descriptor.json
