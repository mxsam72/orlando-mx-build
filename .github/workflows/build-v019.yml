name: Build v019 owner vehicles and bikes
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v019]
    paths:
      - 'V019_SOURCE/**'
      - 'TOOLS/*v019*.py'
      - '.github/workflows/build-v019.yml'
permissions:
  contents: read
concurrency:
  group: orlando-v019-bithlo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source dependencies
        run: python -m pip install -r requirements-v009.txt
      - name: Generate and validate v019 source checkpoint
        run: python TOOLS/build_v019.py --source-only
      - name: Save source checkpoint before native compile
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v019-source-checkpoint
          retention-days: 90
          path: |
            V019_OUTPUT/terrain.raw
            V019_OUTPUT/start.tcl
            V019_OUTPUT/orlandomx_2026_v019.rdf
            V019_OUTPUT/jump_profiles.json
            V019_OUTPUT/start_layout_resolved.json
            V019_OUTPUT/facility_layout.json
            V019_OUTPUT/facility_meshes.json
            V019_OUTPUT/vehicle_meshes.json
            V019_OUTPUT/vehicle_catalog.json
            DOCUMENTATION/v019*.json
            DOCUMENTATION/v019_qa/
      - name: Compile fresh native MAP TRH and PKZ
        run: python TOOLS/build_windows_v019.py
      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v019-game-candidate
          retention-days: 90
          path: |
            12_RELEASE/OrlandoMX_2026_v019.pkz
            12_RELEASE/OrlandoMX_2026_v019.pkz.sha256
            12_RELEASE/OrlandoMX_v019_Validation.json
            12_RELEASE/Install_v019.txt
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v019-build-evidence
          retention-days: 90
          path: |
            DOCUMENTATION/v019*.json
            DOCUMENTATION/v019*.txt
            DOCUMENTATION/v019*.md
            DOCUMENTATION/v019_qa/
            DOCUMENTATION/*.log
            DOCUMENTATION/native*validation.json
            DOCUMENTATION/native_build_failure.txt
            DOCUMENTATION/track_code.txt
