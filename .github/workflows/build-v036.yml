name: Build approved v036 from tested v035
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v036]
    paths: ['V036_SOURCE/**', 'TOOLS/build_v036.py', 'TOOLS/build_windows_v036.py', 'TOOLS/v036_*.py', 'TOOLS/verify_v036_source.py', '.github/workflows/build-v036.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v036-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
      V036_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - name: Restore immutable tested v035 source and native inputs
        run: python TOOLS/v036_release_transfer.py source
      - name: Build approved soils, 30 percent small jumps and roller relocation
        run: python TOOLS/build_v036.py
      - name: Verify protected terrain, measured jumps, masks, stalls and scenery
        run: python TOOLS/verify_v036_source.py
      - name: Compile and verify native MAP TRH textures and PKZ
        run: python TOOLS/build_windows_v036.py
      - name: Preserve verified delivery and complete source privately
        run: python TOOLS/v036_release_transfer.py deliver
