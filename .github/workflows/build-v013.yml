name: Build v013 jump refinement
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v013-jump-refinement]
    paths:
      - 'V013_SOURCE/**'
      - 'TOOLS/*v013*.py'
      - '.github/workflows/build-v013.yml'
      - 'BUILD_V013_LOCAL.bat'
permissions:
  contents: read
concurrency:
  group: orlando-v013-jump-refinement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source dependencies
        run: python -m pip install -r requirements-v009.txt
      - name: Generate and validate v013 source checkpoint
        run: python TOOLS/build_v013.py --source-only
      - name: Save source checkpoint before native compile
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v013-source-checkpoint
          retention-days: 90
          path: |
            V013_OUTPUT/terrain.raw
            V013_OUTPUT/start.tcl
            V013_OUTPUT/orlandomx_2026_v013.rdf
            V013_OUTPUT/jump_profiles.json
            V013_OUTPUT/start_layout_resolved.json
            V013_OUTPUT/facility_layout.json
            V013_OUTPUT/facility_meshes.json
            DOCUMENTATION/v013*.json
            DOCUMENTATION/v013_qa/
      - name: Compile fresh native MAP TRH and PKZ
        run: python TOOLS/build_windows_v013.py
      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v013-game-candidate
          retention-days: 90
          path: |
            12_RELEASE/OrlandoMX_2026_v013.pkz
            12_RELEASE/OrlandoMX_2026_v013.pkz.sha256
            12_RELEASE/OrlandoMX_v013_Validation.json
            12_RELEASE/Install_v013.txt
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v013-build-evidence
          retention-days: 90
          path: |
            DOCUMENTATION/v013*.json
            DOCUMENTATION/v013*.txt
            DOCUMENTATION/v013*.md
            DOCUMENTATION/v013_qa/
            DOCUMENTATION/*.log
            DOCUMENTATION/native*validation.json
            DOCUMENTATION/native_build_failure.txt
            DOCUMENTATION/track_code.txt
