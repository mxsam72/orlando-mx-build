name: Deliver verified v039 after artifact quota failure
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v039]
    paths: ['TOOLS/finalize_v039_delivery.py', '.github/workflows/finalize-v039.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v039-delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
      V039_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt shapely==2.1.2
      - name: Restore verify and deliver the already compiled native package
        run: python TOOLS/finalize_v039_delivery.py
