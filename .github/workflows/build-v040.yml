name: Build v040 asset repairs and freestyle double
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v040]
    paths: ['V040_SOURCE/**', 'TOOLS/build_v040.py', 'TOOLS/build_windows_v040.py', 'TOOLS/v040_*.py', 'TOOLS/verify_v040_source.py', '.github/workflows/build-v040.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v040-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
      V040_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt shapely==2.1.2
      - name: Restore pinned delivered v039 and read its native validation
        run: python TOOLS/v040_release_transfer.py source
      - name: Repair conflicting assets and author freestyle double and entrance arch
        run: python TOOLS/build_v040.py
      - name: Independently verify geometry artwork physics scope and orientation
        run: python TOOLS/verify_v040_source.py
      - name: Compile and validate native MAP TRH with official Windows tools
        run: python TOOLS/build_windows_v040.py
      - name: Preserve verified playable build checksums validation and full source privately
        run: python TOOLS/v040_release_transfer.py deliver
