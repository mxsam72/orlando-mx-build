name: Authenticate v043 and inspect source for v044 realism
on:
  push:
    branches: [rebuild-v044]
    paths: ['.github/workflows/audit-v044.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      V044_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - name: Restore and authenticate actual delivered v043 checkpoint and validation
        run: python TOOLS/v044_source.py
      - name: Inspect material layers vegetation and environment without editing
        run: python TOOLS/v044_audit.py
      - name: Inspect official photographic material and plant sources
        run: python TOOLS/v044_asset_probe.py
      - name: Inspect GLTF model topology for import
        shell: python
        run: |
          import urllib.request,json,os
          from pathlib import Path
          import sys
          sys.path.insert(0,'TOOLS')
          from v044_source import blob
          meta=json.loads(Path('DOCUMENTATION/v044_asset_options.json').read_text())
          for asset in ['tree_small_02','grass_bermuda_01']:
              url=meta[asset]['gltf']['1k']['gltf']['url']
              req=urllib.request.Request(url,headers={'User-Agent':'OrlandoMX'})
              with urllib.request.urlopen(req) as response: doc=json.load(response)
              print('CODEX_'+asset+'_GLTF_BLOB '+blob(json.dumps(doc)),flush=True)
              print(asset,doc.get('nodes'),[(m.get('name'),[(p.get('material'),doc['accessors'][p['attributes']['POSITION']]['count'],doc['accessors'][p['indices']]['count']) for p in m['primitives']]) for m in doc['meshes']],flush=True)
