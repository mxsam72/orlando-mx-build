name: Verify and publish saved v050 PKZ
on:
  workflow_dispatch:
  push:
    branches: [recover-v050]
    paths: ['TOOLS/recover_v050.py', 'TOOLS/build_windows_v050.py', '.github/workflows/recover-v050.yml']
permissions:
  contents: write
concurrency:
  group: orlando-v050-recovery
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      V050_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V050_RELEASE_ID: '412271889'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - name: Run native texture and coordinate regressions
        run: |
          python TOOLS/test_native_texture_aliases_v044.py
          python TOOLS/test_native_coordinate_scan_v044.py
          python TOOLS/test_normal_records_v047.py
      - name: Verify saved PKZ and publish download
        run: python TOOLS/recover_v050.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v050-recovery-validation
          path: |
            12_RELEASE/OrlandoMX_v050_Validation.json
            12_RELEASE/Install_v050.txt
            BUILD/v050_delivery.json
