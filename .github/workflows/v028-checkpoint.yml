name: Restore verified v027 source for v028
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v028]
    paths: ['.github/workflows/v028-checkpoint.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: orlando-v028-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
      V026_CHECKPOINT: BUILD/v028-v026-checkpoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - uses: actions/download-artifact@v5
        with:
          name: OrlandoMX-v027-accepted-v026-baseline
          run-id: 37386243066
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.V026_CHECKPOINT }}
      - name: Restore exact accepted v026 checkpoint
        shell: python
        run: |
          from pathlib import Path
          import os, shutil, json, hashlib
          checkpoint = Path(os.environ['V026_CHECKPOINT'])
          source = checkpoint/'V026_OUTPUT'
          proof = json.loads((source/'baseline_validation.json').read_text())
          assert proof['checks_pass']
          assert proof['actual_source_sha256'] == proof['accepted_v026_sha256']
          for name,digest in proof['actual_source_sha256'].items():
              assert hashlib.sha256((source/name).read_bytes()).hexdigest() == digest
          for folder in ['V026_OUTPUT','V024_OUTPUT','12_RELEASE']:
              shutil.copytree(checkpoint/folder,Path(folder),dirs_exist_ok=True)
      - name: Regenerate the tested v027 source without changing its generators
        run: python TOOLS/build_v027.py --source-only --reuse-baseline
      - name: Verify baseline and trim copied native files
        shell: python
        run: |
          from pathlib import Path
          import json,hashlib
          p=Path('V027_OUTPUT')
          q=json.loads((p/'source_validation.json').read_text())
          assert q['version']=='v027' and q['source_checks_pass']
          assert hashlib.sha256((p/'terrain.raw').read_bytes()).hexdigest() == '8e492abfbae7a6c7ec8c48ff956d28027310c21275b4e3f256d366a60edc0c35'
          for p in Path('12_RELEASE/orlandomx_2026_v027').iterdir():
              if p.suffix in ['.map','.trh']: p.unlink()
      - name: Preserve v027 source checkpoint
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v028-v027-source-checkpoint
          retention-days: 90
          path: |
            V027_OUTPUT/
            V026_OUTPUT/
            V024_OUTPUT/facility_meshes.json
            V024_OUTPUT/vehicle_meshes.json
            V024_OUTPUT/sign_graphic_meshes.json
            12_RELEASE/orlandomx_2026_v027/
      - name: Preserve regeneration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v028-checkpoint-evidence
          path: |
            V027_OUTPUT/*validation.json
            DOCUMENTATION/v027*validation.json
