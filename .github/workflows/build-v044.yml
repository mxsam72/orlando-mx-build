name: Build v044 standard-weather advanced realism
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v044]
    paths: ['V044_SOURCE/**', 'TOOLS/build_v044.py', 'TOOLS/build_windows_v044.py', 'TOOLS/v044_*.py', 'TOOLS/scene_texture_bindings_v044.py', 'TOOLS/verify_v044_source.py', '.github/workflows/build-v044.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v044-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[native-recovery]') }}
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      V044_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt fast-simplification==0.1.13
      - name: Restore authenticated saved v044 visuals without reauthoring
        run: python TOOLS/v044_release_transfer.py resume
      - name: Independently recheck preserved track and scenery
        run: python TOOLS/verify_v044_source.py
      - name: Preserve source in private release assets without Actions artifact storage
        run: python TOOLS/v044_release_transfer.py hold
      - name: Compile official native graphics collision and centerline
        run: python TOOLS/build_windows_v044.py
      - name: Deliver verified PKZ checksums and source through private GitHub release
        run: python TOOLS/v044_release_transfer.py deliver
      - name: Preserve native failure diagnostics
        if: failure()
        run: python TOOLS/v044_release_transfer.py diagnostics
