# Rebuild after cross-platform LF normalization of v067 lighting and map params.
name: Native v067 build - approved dirt and 11am daylight

on:
  workflow_dispatch:
  push:
    branches: [rebuild-v067]
    paths:
      - .github/workflows/build-v067.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: orlando-v067-native
  cancel-in-progress: false

jobs:
  native-build:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      V052_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'

    steps:
      - name: Check out approved v067 source
        uses: actions/checkout@v4

      - name: Python 3.12 authoring environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned authoring dependencies
        run: python -m pip install -r requirements-v009.txt shapely==2.2.0

      - name: Verify authorization and retain approved source hashes
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import json,shutil; a=json.loads(Path('V067_SOURCE/native_build_authorization.json').read_text()); assert a['native_compilation_authorized'] and a['reference_preview_run_id']==38954524092; Path('BUILD').mkdir(exist_ok=True); shutil.copyfile('V067_SOURCE/native_expected_inputs.json','BUILD/v067_pinned_expected.json'); print('APPROVED_V067_PINNED',a['reference_preview_run_id'])"
          exit $LASTEXITCODE

      - name: Restore hash-checked v066 source without altering v066 release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force DOCUMENTATION | Out-Null
          python TOOLS/v066_lighting.py restore 2>&1 | Tee-Object DOCUMENTATION/v067_source_restore.log
          exit $LASTEXITCODE

      - name: Generate the exact six v067 dirt maps and synchronized 11am daylight
        shell: pwsh
        run: |
          python TOOLS/v067_surface.py 2>&1 | Tee-Object DOCUMENTATION/v067_surface_authoring.log
          exit $LASTEXITCODE

      - name: Verify preview-approved native hashes and stage separate v067 game files
        shell: pwsh
        run: |
          python TOOLS/native_base_v067.py 2>&1 | Tee-Object DOCUMENTATION/v067_native_source_check.log
          exit $LASTEXITCODE

      - name: Verify official TerrainEd and scenery contracts
        shell: pwsh
        run: |
          python TOOLS/test_native_texture_aliases_v044.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TOOLS/test_native_coordinate_scan_v044.py
          exit $LASTEXITCODE

      - name: Stage source maps, retained native scenery, and exact geometry
        shell: pwsh
        run: |
          python TOOLS/build_windows_v067.py stage 2>&1 | Tee-Object DOCUMENTATION/v067_native_staging.log
          exit $LASTEXITCODE

      - name: Save reproducible v067 precompilation checkpoint
        run: python TOOLS/v067_transfer.py checkpoint

      - name: Compile collision and merge preserved start and main race routes
        run: python TOOLS/build_windows_v067.py collision

      - name: Compile native terrain visuals and validate complete v067 MX Bikes PKZ
        run: python TOOLS/build_windows_v067.py final

      - name: Publish validated v067 release and installation instructions
        run: python TOOLS/v067_transfer.py deliver

      - name: Preserve failure diagnostics if release exists
        if: failure()
        run: python TOOLS/v067_transfer.py diagnostics

      - name: Upload compact validation reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v067-native-validation
          retention-days: 14
          if-no-files-found: warn
          path: |
            V067_OUTPUT/*validation.json
            V067_OUTPUT/native_compile_results.json
            V067_OUTPUT/generated_final_inputs.json
            DOCUMENTATION/*v067*.log
            DOCUMENTATION/*v067*.json
            12_RELEASE/OrlandoMX_v067_Validation.json
            12_RELEASE/Install_v067.txt
            BUILD/v067_delivery.json
            BUILD/v067_checkpoint_descriptor.json
