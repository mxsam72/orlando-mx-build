name: Moon v002 native test build
on:
  push:
    branches: [moon-taurus-littrow-v002]
    paths: ['MOON/**', '.github/workflows/moon-v002-test.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: moon-v002-native
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_sha: ${{ steps.pack.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            MOON
            TOOLS
            BUILD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source dependencies
        run: |
          python -m pip install -r MOON/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libxext6
      - name: Download pinned Blender 4.5.3 LTS
        run: |
          curl -fL --retry 3 https://mirrors.ocf.berkeley.edu/blender/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Author and check measured terrain, regolith, pits and routes
        run: python MOON/scripts/build_test.py
      - name: Export native scenery and inspectable source previews
        run: /tmp/blender-4.5.3-linux-x64/blender -b --factory-startup -t 8 --python MOON/scripts/build_scene_test.py
      - name: Preserve exact native input checkpoint
        id: pack
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,os
          with zipfile.ZipFile('Moon_v002_Native_Inputs.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for folder in ['MOON/build','MOON/previews_v002']:
                  for p in sorted(Path(folder).rglob('*')):
                      if p.is_file():z.write(p,p.as_posix())
          digest=hashlib.sha256(Path('Moon_v002_Native_Inputs.zip').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+digest+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Moon-v002-native-input-checkpoint
          path: Moon_v002_Native_Inputs.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Moon-v002-source-previews
          path: MOON/previews_v002/
          retention-days: 30
  native:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            MOON
            TOOLS
            BUILD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy pillow
      - uses: actions/download-artifact@v4
        with:
          name: Moon-v002-native-input-checkpoint
      - name: Verify and unpack exact Linux-authored inputs
        env:
          EXPECTED_INPUT_SHA: ${{ needs.source.outputs.archive_sha }}
        run: |
          python -c "import pathlib,hashlib,os,zipfile; p=pathlib.Path('Moon_v002_Native_Inputs.zip'); assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['EXPECTED_INPUT_SHA']; z=zipfile.ZipFile(p); assert all(not pathlib.Path(n).is_absolute() and '..' not in pathlib.Path(n).parts for n in z.namelist()); z.extractall('.')"
      - name: Compile and validate native scenery, sky, collision, route and graphics
        run: python MOON/scripts/native_test.py
      - name: Bundle inspected source previews
        run: |
          python -c "from pathlib import Path; import zipfile; z=zipfile.ZipFile('MOON/Moon_v002_Previews.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,p.name) for p in Path('MOON/previews_v002').iterdir() if p.is_file()]; z.close()"
      - name: Publish validated test candidate and installation files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python MOON/scripts/publish_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moon-v002-native-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            MOON/native_logs/
            MOON/Moon_v002_Validation.json
            MOON/v002_delivery.json
            MOON/Taurus_Littrow_MX_v002.pkz*
