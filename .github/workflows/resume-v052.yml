name: Resume v052 reviewed source and verified matte foliage export
on:
  workflow_dispatch:
  push:
    branches: [resume-v052]
    paths: ['TOOLS/*v052*.py', '.github/workflows/resume-v052.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v052-resume
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      V052_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - run: python -m unittest discover -s TOOLS -p "test_*v04[47].py"
      - run: python -m unittest discover -s TOOLS -p "test_*v052.py"
      - name: Restore exact reviewed source and official scenery export
        run: python TOOLS/resume_v052.py
      - name: Verify native matte foliage then compile terrain and validate PKZ
        run: python TOOLS/build_windows_v052.py
      - name: Publish verified v052 download
        run: python TOOLS/v052_transfer.py deliver
      - name: Preserve failure diagnostics
        if: failure()
        run: python TOOLS/v052_transfer.py diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v052-resumed-native-validation
          path: |
            V052_OUTPUT/*.json
            DOCUMENTATION/*v052*.log
            DOCUMENTATION/*v052*.json
            12_RELEASE/OrlandoMX_v052_Validation.json
            BUILD/v052_delivery.json
            BUILD/v052_recovery.json
