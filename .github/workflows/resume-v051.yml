name: Resume v051 with native green photographic grass
on:
  workflow_dispatch:
  push:
    branches: [resume-v051]
    paths: ['TOOLS/resume_v051.py', 'TOOLS/*v051*.py', '.github/workflows/resume-v051.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v051-resume
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      V051_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - run: python -m unittest discover -s TOOLS -p "test_*v04[47].py"
      - name: Restore saved source and bake photographic grass colour for native export
        run: python TOOLS/resume_v051.py
      - name: Compile corrected scenery and terrain, then verify final PKZ
        run: python TOOLS/build_windows_v051.py
      - name: Publish verified v051 download
        run: python TOOLS/v051_transfer.py deliver
      - name: Preserve failure diagnostics
        if: failure()
        run: python TOOLS/v051_transfer.py diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v051-resume-validation
          path: |
            V051_OUTPUT/*.json
            DOCUMENTATION/*v051*.log
            DOCUMENTATION/*v051*.json
            12_RELEASE/OrlandoMX_v051_Validation.json
            BUILD/v051_delivery.json
