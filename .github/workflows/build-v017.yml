name: Build v017 final jump and pit-road refinement
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v017]
    paths:
      - 'V017_SOURCE/**'
      - 'TOOLS/*v017*.py'
      - '.github/workflows/build-v017.yml'
permissions:
  contents: read
concurrency:
  group: orlando-v017-final-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source dependencies
        run: python -m pip install -r requirements-v009.txt
      - name: Generate and validate v017 source checkpoint
        run: python TOOLS/build_v017.py --source-only
      - name: Save source checkpoint before native compile
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v017-source-checkpoint
          retention-days: 90
          path: |
            V017_OUTPUT/terrain.raw
            V017_OUTPUT/start.tcl
            V017_OUTPUT/orlandomx_2026_v017.rdf
            V017_OUTPUT/jump_profiles.json
            V017_OUTPUT/start_layout_resolved.json
            V017_OUTPUT/facility_layout.json
            V017_OUTPUT/facility_meshes.json
            DOCUMENTATION/v017*.json
            DOCUMENTATION/v017_qa/
      - name: Compile fresh native MAP TRH and PKZ
        run: python TOOLS/build_windows_v017.py
      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v017-game-candidate
          retention-days: 90
          path: |
            12_RELEASE/OrlandoMX_2026_v017.pkz
            12_RELEASE/OrlandoMX_2026_v017.pkz.sha256
            12_RELEASE/OrlandoMX_v017_Validation.json
            12_RELEASE/Install_v017.txt
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v017-build-evidence
          retention-days: 90
          path: |
            DOCUMENTATION/v017*.json
            DOCUMENTATION/v017*.txt
            DOCUMENTATION/v017*.md
            DOCUMENTATION/v017_qa/
            DOCUMENTATION/*.log
            DOCUMENTATION/native*validation.json
            DOCUMENTATION/native_build_failure.txt
            DOCUMENTATION/track_code.txt
