name: Verify accepted v026 source for v027
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v027]
    paths: ['.github/workflows/v027-baseline.yml']
permissions:
  contents: read
concurrency:
  group: orlando-v027-baseline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - name: Regenerate accepted v026 source
        run: python TOOLS/build_v026.py --source-only
      - name: Check exact accepted terrain scenery and start hashes
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          expected = {
              'terrain.raw': '334f8042e4f2c3f2507e2ace1dea52e1dffa80f2900f89a3c701bdc39296d27f',
              'scenery.fbx': '98dc23a52fc9868a155d47368e10ff5645727033fc98b649cfb9d264cf9cdd90',
              'start.tcl': 'b1dcaa07fe6e7a95eb1acfc40af00139ce00850e9df1133b894e3d0c3be2b0df',
          }
          for filename, digest in expected.items():
              actual = hashlib.sha256((Path('V026_OUTPUT')/filename).read_bytes()).hexdigest()
              assert actual == digest, filename + ' differs from accepted v026'
              print(filename, actual)
      - name: Preserve accepted source checkpoint
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v027-accepted-v026-baseline
          retention-days: 90
          compression-level: 6
          path: |
            V026_OUTPUT/
            V024_OUTPUT/facility_meshes.json
            V024_OUTPUT/vehicle_meshes.json
            V024_OUTPUT/sign_graphic_meshes.json
            12_RELEASE/orlandomx_2026_v026/
      - name: Preserve baseline diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v027-baseline-evidence
          retention-days: 90
          path: |
            DOCUMENTATION/v024*validation.json
            DOCUMENTATION/v024_source_checkpoint.json
            V026_OUTPUT/*validation.json
