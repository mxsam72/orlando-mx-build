name: Inspect saved v044 native texture records without recompiling
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v044]
    paths: ['TOOLS/inspect_native_bitmap_records.py', '.github/workflows/inspect-v044-native.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      V044_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - name: Inspect authenticated compiled checkpoint and every active diffuse bitmap
        run: python TOOLS/inspect_native_bitmap_records.py
