name: Final v060 build - tighter grooming everywhere
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v060]
    paths: ['.github/workflows/build-v060.yml', 'TOOLS/*v060*.py', 'V060_SOURCE/**']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v060-native
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      V052_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - name: Recover pinned approved source and rebuild v060 final inputs
        run: |
          New-Item -ItemType Directory -Force DOCUMENTATION | Out-Null
          python TOOLS/v060_inputs.py restore 2>&1 | Tee-Object DOCUMENTATION/v060_source_recovery.log
          exit $LASTEXITCODE
      - name: Verify native bitmap and scenery coordinate checker contracts
        run: |
          python TOOLS/test_native_texture_aliases_v044.py
          python TOOLS/test_native_coordinate_scan_v044.py
      - name: Preserve checked final source before compilation
        run: python TOOLS/v060_transfer.py checkpoint
      - name: FINAL NATIVE COMPILATION - scenery collision visual MAP and checks
        run: python TOOLS/build_windows_v060.py
      - name: Deliver validated PKZ and checksums
        run: python TOOLS/v060_transfer.py deliver
      - name: Preserve diagnostics on failure
        if: failure()
        run: python TOOLS/v060_transfer.py diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v060-validation-and-delivery
          path: |
            V060_OUTPUT/*validation.json
            V060_OUTPUT/native_compile_results.json
            V060_OUTPUT/generated_final_inputs.json
            V058_OUTPUT/*validation.json
            V059_OUTPUT/*validation.json
            BUILD/v058_input_validation.json
            DOCUMENTATION/*v060*.log
            DOCUMENTATION/*v060*.json
            12_RELEASE/OrlandoMX_v060_Validation.json
            12_RELEASE/Install_v060.txt
            BUILD/v060_delivery.json
            BUILD/v060_checkpoint_descriptor.json
