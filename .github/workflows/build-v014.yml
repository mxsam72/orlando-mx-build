name: Build v014 jump pit and tree refinement
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v014-jump-pit-tree-refinement]
    paths:
      - 'V014_SOURCE/**'
      - 'TOOLS/*v014*.py'
      - '.github/workflows/build-v014.yml'
      - 'BUILD_V014_LOCAL.bat'
permissions:
  contents: read
concurrency:
  group: orlando-v014-jump-pit-tree-refinement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source dependencies
        run: python -m pip install -r requirements-v009.txt
      - name: Generate and validate v014 source checkpoint
        run: python TOOLS/build_v014.py --source-only
      - name: Save source checkpoint before native compile
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v014-source-checkpoint
          retention-days: 90
          path: |
            V014_OUTPUT/terrain.raw
            V014_OUTPUT/start.tcl
            V014_OUTPUT/orlandomx_2026_v014.rdf
            V014_OUTPUT/jump_profiles.json
            V014_OUTPUT/start_layout_resolved.json
            V014_OUTPUT/facility_layout.json
            V014_OUTPUT/facility_meshes.json
            DOCUMENTATION/v014*.json
            DOCUMENTATION/v014_qa/
      - name: Compile fresh native MAP TRH and PKZ
        run: python TOOLS/build_windows_v014.py
      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v014-game-candidate
          retention-days: 90
          path: |
            12_RELEASE/OrlandoMX_2026_v014.pkz
            12_RELEASE/OrlandoMX_2026_v014.pkz.sha256
            12_RELEASE/OrlandoMX_v014_Validation.json
            12_RELEASE/Install_v014.txt
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v014-build-evidence
          retention-days: 90
          path: |
            DOCUMENTATION/v014*.json
            DOCUMENTATION/v014*.txt
            DOCUMENTATION/v014*.md
            DOCUMENTATION/v014_qa/
            DOCUMENTATION/*.log
            DOCUMENTATION/native*validation.json
            DOCUMENTATION/native_build_failure.txt
            DOCUMENTATION/track_code.txt
