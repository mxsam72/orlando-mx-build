name: Build v052 restored grass boundaries and stronger straight grooming
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v052]
    paths: ['V052_SOURCE/**', 'TOOLS/*v052*.py', '.github/workflows/build-v052.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: orlando-v052-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 210
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      V052_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - name: Check native bitmap and coordinate validators
        run: python -m unittest discover -s TOOLS -p "test_*v04[47].py"
      - name: Restore authenticated scenery, collision, soil and photographic grass
        run: python TOOLS/v052_transfer.py restore
      - name: Strengthen lengthwise grooming only on straights and retain v051 corners
        run: python TOOLS/v052_surface.py
      - name: Restore v050 grass placement with the v051 green photographic texture
        run: python TOOLS/v052_scenery.py
      - name: Make foliage matte and preserve approved green diffuse cutouts
        run: python TOOLS/v052_foliage.py
      - name: Render actual terrain and grass source for visual QA
        run: python TOOLS/v052_previews.py
      - name: Expose source views and validation for visual review
        uses: actions/upload-artifact@v4
        with:
          name: v052-source-review
          path: |
            BUILD/v052_review/*.jpg
            BUILD/v052_review/*.json
            V052_OUTPUT/*.json
      - name: Preserve verified authoring source before compilation
        run: python TOOLS/v052_transfer.py checkpoint
      - name: Compile new grass scenery and complete terrain graphics
        run: python TOOLS/build_windows_v052.py
      - name: Publish verified playable v052 within the size budget
        run: python TOOLS/v052_transfer.py deliver
      - name: Preserve failure diagnostics
        if: failure()
        run: python TOOLS/v052_transfer.py diagnostics
      - name: Save validation and comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v052-validation-and-previews
          path: |
            V052_OUTPUT/*.json
            DOCUMENTATION/*v052*.log
            DOCUMENTATION/*v052*.json
            12_RELEASE/OrlandoMX_v052_Validation.json
            BUILD/v052_review/*.jpg
          if-no-files-found: warn
