name: Build v015 jump pit grass refinement
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v015-jump-pit-grass-refinement]
    paths:
      - 'V015_SOURCE/**'
      - 'TOOLS/*v015*.py'
      - '.github/workflows/build-v015.yml'
      - 'BUILD_V015_LOCAL.bat'
permissions:
  contents: read
concurrency:
  group: orlando-v015-jump-pit-grass-refinement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source dependencies
        run: python -m pip install -r requirements-v009.txt
      - name: Generate and validate v015 source checkpoint
        run: python TOOLS/build_v015.py --source-only
      - name: Save source checkpoint before native compile
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v015-source-checkpoint
          retention-days: 90
          path: |
            V015_OUTPUT/terrain.raw
            V015_OUTPUT/start.tcl
            V015_OUTPUT/orlandomx_2026_v015.rdf
            V015_OUTPUT/jump_profiles.json
            V015_OUTPUT/start_layout_resolved.json
            V015_OUTPUT/facility_layout.json
            V015_OUTPUT/facility_meshes.json
            DOCUMENTATION/v015*.json
            DOCUMENTATION/v015_qa/
      - name: Compile fresh native MAP TRH and PKZ
        run: python TOOLS/build_windows_v015.py
      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v015-game-candidate
          retention-days: 90
          path: |
            12_RELEASE/OrlandoMX_2026_v015.pkz
            12_RELEASE/OrlandoMX_2026_v015.pkz.sha256
            12_RELEASE/OrlandoMX_v015_Validation.json
            12_RELEASE/Install_v015.txt
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v015-build-evidence
          retention-days: 90
          path: |
            DOCUMENTATION/v015*.json
            DOCUMENTATION/v015*.txt
            DOCUMENTATION/v015*.md
            DOCUMENTATION/v015_qa/
            DOCUMENTATION/*.log
            DOCUMENTATION/native*validation.json
            DOCUMENTATION/native_build_failure.txt
            DOCUMENTATION/track_code.txt
