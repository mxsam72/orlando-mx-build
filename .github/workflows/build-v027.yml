name: Build v027 Orlando pits and riding surfaces
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v027]
    paths: ['V027_SOURCE/**', 'TOOLS/*v027*.py', '.github/workflows/build-v027.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: orlando-v027-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
      V027_CHECKPOINT: BUILD/v027-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-v009.txt
      - name: Download verified baseline checkpoint
        uses: actions/download-artifact@v5
        with:
          name: OrlandoMX-v027-accepted-v026-baseline
          run-id: 37386243066
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.V027_CHECKPOINT }}
      - name: Restore data-only checkpoint with recorded checks
        shell: python
        run: |
          from pathlib import Path
          import os, shutil, json, hashlib
          checkpoint = Path(os.environ['V027_CHECKPOINT'])
          source = checkpoint/'V026_OUTPUT'
          proof = json.loads((source/'baseline_validation.json').read_text())
          assert proof['checks_pass']
          for filename, digest in proof['actual_source_sha256'].items():
              assert hashlib.sha256((source/filename).read_bytes()).hexdigest() == digest
          for folder in ['V026_OUTPUT','V024_OUTPUT','12_RELEASE']:
              shutil.copytree(checkpoint/folder, Path(folder), dirs_exist_ok=True)
      - name: Build v027 source and validate clearances and shared surface fields
        run: python TOOLS/build_v027.py --source-only --reuse-baseline
      - name: Compile new native MAP TRH and PKZ
        run: python TOOLS/build_windows_v027.py
      - name: Upload game test candidate
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v027-game-candidate
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
          path: |
            12_RELEASE/OrlandoMX_2026_v027.pkz
            12_RELEASE/OrlandoMX_2026_v027.pkz.sha256
            12_RELEASE/OrlandoMX_v027_Validation.json
            12_RELEASE/Install_v027.txt
      - name: Preserve source previews and build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v027-build-evidence
          retention-days: 90
          path: |
            V027_OUTPUT/*validation.json
            V027_OUTPUT/compiled_track.hmf
            V027_OUTPUT/material_tiles.png
            V027_OUTPUT/surface_layout.png
            V027_OUTPUT/pit_and_corner_detail.png
            V027_OUTPUT/v027_height_change_region.png
            DOCUMENTATION/v027*
            DOCUMENTATION/*validation.json
            DOCUMENTATION/*.log
            DOCUMENTATION/native_build_failure.txt
