name: v067 Full Resolution Preview Renders (NO native compilation)

on:
  push:
    branches: [rebuild-v067]
    paths:
      - .github/workflows/render-v067-previews.yml
      - TOOLS/v067_*.py
      - V067_SOURCE/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orlando-v067-preview-only
  cancel-in-progress: false

jobs:
  source-previews:
    name: Six 1920x1080 source previews
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out unchanged v067 source
        uses: actions/checkout@v4

      - name: Python 3.12 for offline source preparation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect free disk space
        run: df -h .

      - name: Install source preparation Python dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pillow matplotlib

      - name: Install official Blender 4.5.3 LTS (headless)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libxext6
          curl --retry 3 --retry-delay 5 --fail --location --silent --show-error \
            https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender-4.5.3-linux-x64.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender-4.5.3-linux-x64.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" --background --factory-startup --python-expr "import bpy,numpy;print('BLENDER_READY',bpy.app.version_string,numpy.__version__)"
          df -h .

      - name: Restore hash-pinned v066 source (never compile)
        run: python TOOLS/v066_lighting.py restore

      - name: Author and validate v067 material and daylight changes
        run: python TOOLS/v067_surface.py

      - name: Prepare authenticated actual-source mesh, UV, and textures
        run: python TOOLS/v067_prepare_previews.py

      - name: Render all six full-resolution Blender Cycles views
        shell: bash
        run: |
          "$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" --background --factory-startup --threads 4 \
            --python TOOLS/v067_render_previews.py

      - name: Package all six previews into labeled review sheet and ZIP
        run: python TOOLS/v067_deliver_previews.py --out DOCUMENTATION/v067_review/delivery

      - name: Upload source-only previews, even when partially rendered
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrlandoMX-v067-source-previews
          retention-days: 14
          if-no-files-found: warn
          path: |
            DOCUMENTATION/v067_review/*.png
            DOCUMENTATION/v067_review/renders.json
            DOCUMENTATION/v067_review/delivery/*.png
            DOCUMENTATION/v067_review/delivery/*.jpg
            DOCUMENTATION/v067_review/delivery/*.zip
            DOCUMENTATION/v067_review/delivery/*.txt
            V067_SOURCE/visual_spec.json
            V067_SOURCE/precompile_validation.json
