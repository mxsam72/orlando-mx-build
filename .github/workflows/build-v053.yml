name: v053 cancelled - keep v052
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v053]
    paths: ['.github/workflows/build-v053.yml']
permissions:
  contents: read
# Use the existing build group so this run stops the active v053 compiler.
concurrency:
  group: orlando-v053
  cancel-in-progress: true
jobs:
  record-cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the user's decision to retain v052
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          v053 was cancelled at the user's request on 2026-10-14 after reviewing the comparisons.
          v052 remains the approved baseline, including its original dirt colour and appearance.
          This workflow performs no compilation, packaging or publication.
          [Download v052](https://github.com/mxsam72/orlando-mx-build/releases/download/v052-natural-dirt-grass-38537630164/OrlandoMX_2026_v052.pkz)
          EOF
