name: Build v010 IRL corrections
on:
  workflow_dispatch:
  push:
    branches: [rebuild-v010-irl-corrections]
    paths:
      - 'V010_SOURCE/**'
      - 'TOOLS/*v010*.py'
      - '.github/workflows/build-v010.yml'
      - 'BUILD_V010_LOCAL.bat'
permissions:
  contents: read
concurrency:
  group: orlando-v010-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source dependencies
        run: python -m pip install -r requirements-v009.txt
      - name: Generate and validate v010 source checkpoint
        run: python TOOLS/build_v010.py --source-only
      - name: Save source checkpoint before native compile
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v010-source-checkpoint
          retention-days: 90
          path: |
            V010_OUTPUT/terrain.raw
            V010_OUTPUT/start.tcl
            V010_OUTPUT/orlandomx_2026_v010.rdf
            V010_OUTPUT/facility_layout.json
            DOCUMENTATION/v010*.json
            DOCUMENTATION/v010_qa/
      - name: Compile fresh native MAP TRH and PKZ
        run: python TOOLS/build_windows_v010.py
      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v010-game-candidate
          retention-days: 90
          path: |
            12_RELEASE/OrlandoMX_2026_v010.pkz
            12_RELEASE/OrlandoMX_2026_v010.pkz.sha256
            12_RELEASE/OrlandoMX_v010_Validation.json
            12_RELEASE/Install_v010.txt
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrlandoMX-v010-build-evidence
          retention-days: 90
          path: |
            DOCUMENTATION/v010*.json
            DOCUMENTATION/v010*.txt
            DOCUMENTATION/v010*.md
            DOCUMENTATION/v010_qa/
            DOCUMENTATION/*.log
            DOCUMENTATION/native*validation.json
            DOCUMENTATION/native_build_failure.txt
            DOCUMENTATION/track_code.txt
